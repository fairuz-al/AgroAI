services:
  web:
    build: .
    container_name: agroai_web
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    environment:
      # Kita langsung hardcode host-nya ke service 'db' milik docker
      - DATABASE_URL=postgresql://postgres:secret_password@db:5432/agroai_db
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy # Menunggu DB benar-benar siap total sebelum web jalan

  db:
    image: postgres:15-alpine
    container_name: agroai_postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret_password
      - POSTGRES_DB=agroai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck: # Menambahkan indikator sehat agar web tidak start kepagian
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: