services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
      network: host
    ports:
      - "8000:8000"
    volumes:
      # Memetakan akar proyek secara presisi agar sinkron dengan struktur folder VS Code kamu
      - .:/workspace
    # Menetapkan direktori kerja utama di dalam kontainer secara eksplisit
    working_dir: /workspace
    environment:
      # Membaca variabel environment secara dinamis dari file .env lokal
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-agroai}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-agroai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Perbaikan: Menggunakan skema kueri pengecekan berlapis yang toleran terhadap inisialisasi awal db
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-agroai}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_data: